<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Master - Ultimate Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Theme Variables */
        :root[data-theme="dark"] {
            --bg-grad-1: #0f172a; --bg-grad-2: #312e81; --bg-grad-3: #1e1b4b; --bg-grad-4: #020617;
            --glass-bg: rgba(30, 41, 59, 0.8);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
        }
        :root[data-theme="light"] {
            --bg-grad-1: #f1f5f9; --bg-grad-2: #e2e8f0; --bg-grad-3: #cbd5e1; --bg-grad-4: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.1);
            --text-main: #0f172a;
            --text-muted: #475569;
            --input-bg: rgba(255, 255, 255, 0.9);
        }
        
        :root { --accent: #3b82f6; --expense: #ef4444; --income: #10b981; --warning: #f59e0b; }

        body {
            font-family: Tahoma, system-ui, sans-serif;
            background: linear-gradient(-45deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3), var(--bg-grad-4));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            margin: 0; padding: 20px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            transition: color 0.3s;
        }
        
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .container { max-width: 1000px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        .full-width { grid-column: 1 / -1; }

        .card { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 25px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2); transition: background 0.3s; }
        
        /* Global Nav */
        .global-nav { width: 100%; max-width: 1000px; display: flex; align-items: center; margin-bottom: 20px; background: var(--glass-bg); padding: 10px 20px; border-radius: 15px; border: 1px solid var(--glass-border); box-sizing: border-box; }
        .nav-left { display: flex; gap: 10px; }
        .nav-right { display: flex; gap: 10px; margin-inline-start: auto; }
        
        h2, h3 { margin-top: 0; color: var(--accent); }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }

        form { display: flex; flex-direction: column; gap: 15px; }
        input, select, textarea { background: var(--input-bg); border: 1px solid var(--glass-border); color: var(--text-main); padding: 12px; border-radius: 10px; outline: none; font-family: inherit; }
        input:disabled { opacity: 0.5; cursor: not-allowed; }
        textarea { resize: vertical; min-height: 60px; }
        
        button { background: var(--accent); color: white; font-weight: bold; cursor: pointer; transition: 0.3s; border: none; padding: 12px; border-radius: 10px; }
        button:hover { filter: brightness(1.1); transform: translateY(-2px); }
        button.btn-outline { background: transparent; border: 1px solid var(--glass-border); color: var(--text-main); }
        button.btn-outline:hover, button.btn-outline.active { background: var(--accent); color: white; border-color: var(--accent); }
        button.btn-danger { background: var(--expense); }
        button.btn-warning { background: var(--warning); color: black; }
        
        /* Prediction Card */
        .prediction-card { border-inline-start: 5px solid #8b5cf6; }
        
        /* Lists */
        .transaction-list { list-style: none; padding: 0; margin: 0; max-height: 250px; overflow-y: auto; }
        .transaction-item { display: flex; justify-content: space-between; background: rgba(0,0,0,0.1); padding: 12px; border-radius: 8px; margin-bottom: 8px; border-inline-end: 4px solid var(--expense); }
        .transaction-item.income { border-inline-end-color: var(--income); }
        .transaction-item.installment { border-inline-end-color: var(--warning); }
        .transaction-date { font-size: 0.8rem; color: var(--text-muted); background: rgba(128,128,128,0.2); padding: 2px 6px; border-radius: 4px; }
        .transaction-desc { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

        /* Summary Boxes */
        .summary-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .summary-item { flex: 1; padding: 12px; border-radius: 10px; text-align: center; font-size: 0.95rem; font-weight: bold; }
        .summary-income { background: rgba(16, 185, 129, 0.15); color: var(--income); border: 1px solid rgba(16, 185, 129, 0.3); }
        .summary-expense { background: rgba(239, 68, 68, 0.15); color: var(--expense); border: 1px solid rgba(239, 68, 68, 0.3); }
        
        /* Filters */
        .filters { display: flex; gap: 10px; margin-bottom: 15px; }
        .filters button { flex: 1; padding: 8px; font-size: 0.85rem; }

        .hidden { display: none !important; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; color: var(--text-main); }
        th, td { border: 1px solid var(--glass-border); padding: 10px; text-align: center; }
    </style>
</head>
<body>

<!-- GLOBAL NAV -->
<div class="global-nav">
    <div id="userNav" class="nav-left hidden">
        <button id="adminBtn" onclick="showAdminPanel()" class="btn-outline hidden" style="border-color:var(--warning); color:var(--warning)" data-i18n="adminBtn">⚙️ پنل مدیریت</button>
        <button onclick="showSettings()" class="btn-outline" title="پروفایل / تنظیمات">👤</button>
        <button onclick="logout()" class="btn-danger" title="خروج">🚪</button>
    </div>
    <div class="nav-right">
        <button onclick="toggleTheme()" class="btn-outline" data-i18n="themeBtn">🌓 تم</button>
        <button onclick="toggleLang()" class="btn-outline">EN / FA</button>
    </div>
</div>

<!-- AUTHENTICATION PAGE -->
<div id="authPage" class="container" style="max-width: 400px; margin: auto;">
    <div class="card full-width">
        <h2 style="text-align:center" data-i18n="authTitle">ورود / ثبت‌نام</h2>
        <form id="authForm">
            <input type="text" id="username" data-i18n-placeholder="usernamePlh" placeholder="نام کاربری" required>
            <input type="password" id="password" data-i18n-placeholder="passwordPlh" placeholder="رمز عبور" required>
            <button type="submit" id="loginBtn" data-i18n="loginBtn">ورود</button>
            <button type="button" id="registerBtn" class="btn-outline" onclick="registerUser()" data-i18n="regBtn">ثبت‌نام جدید</button>
        </form>
        <p id="authMsg" style="color:var(--warning); text-align:center; font-size:0.9rem; margin-top:15px;"></p>
    </div>
</div>

<!-- MAIN APP PAGE -->
<div id="appPage" class="hidden" style="width:100%; max-width: 1000px;">
    
    <div class="container">
        <!-- Balance Card -->
        <div class="card full-width flex-between" style="background: linear-gradient(135deg, #047857, #0ea5e9, #3b82f6); color:white; border:none; position:relative; overflow:hidden;">
            <div style="width: 100%; text-align: center;">
                <p style="margin:0; opacity:0.9;" data-i18n="currentBalance">موجودی فعلی</p>
                <div style="font-size: 2.8rem; font-weight: bold; margin: 10px 0; position:relative; z-index:1;" id="totalBalance">0</div>
                <div style="font-size: 0.95rem; background: rgba(0,0,0,0.3); display: inline-block; padding: 6px 15px; border-radius: 20px; position:relative; z-index:1;" id="netBalance"></div>
            </div>
        </div>

        <!-- AI Analysis -->
        <div class="card prediction-card full-width">
            <h2 data-i18n="aiAnalysis">تحلیل‌گر مالی</h2>
            <div id="aiAnalysisBox" style="line-height:1.8; font-size:0.95rem;"></div>
        </div>

        <!-- Add Transaction -->
        <div class="card">
            <h2 data-i18n="addTrans">ثبت تراکنش</h2>
            <form id="transactionForm">
                <select id="type" onchange="updateCategories()">
                    <option value="expense" data-i18n="optExpense">هزینه (خروجی)</option>
                    <option value="income" data-i18n="optIncome">درآمد (ورودی)</option>
                </select>
                <input type="number" id="amount" data-i18n-placeholder="amountPlh" placeholder="مبلغ" required>
                <select id="category"></select>
                <input type="date" id="date" required>
                <textarea id="description" data-i18n-placeholder="descPlh" placeholder="توضیحات (اختیاری)"></textarea>
                <button type="submit" data-i18n="saveBtn">ثبت</button>
            </form>
        </div>

        <!-- Installments & Debts -->
        <div class="card">
            <h2 data-i18n="instTitle">مدیریت اقساط</h2>
            <form id="installmentForm">
                <select id="instCategory" required></select>
                <input type="number" id="instAmount" data-i18n-placeholder="amountPlh" placeholder="مبلغ قسط" required>
                <input type="date" id="instDate" required>
                <textarea id="instDesc" data-i18n-placeholder="descPlh" placeholder="توضیحات (اختیاری)"></textarea>
                <button type="submit" class="btn-warning" data-i18n="instSaveBtn">ثبت یادآوری</button>
            </form>
            <h3 style="font-size: 1rem; color: var(--text-muted); margin-top: 20px;" data-i18n="instUpcoming">اقساط پیش رو:</h3>
            <ul class="transaction-list" id="installmentList"></ul>
        </div>

        <!-- Analytics Charts -->
        <div class="card full-width">
            <div class="flex-between" style="margin-bottom:15px;">
                <h2 data-i18n="chartTitle">آنالیز و آمار</h2>
                <div style="display:flex; gap:5px;">
                    <button class="btn-outline active" onclick="setChartMode('percent', this)" style="padding:5px 10px;" data-i18n="btnPercent">درصد</button>
                    <button class="btn-outline" onclick="setChartMode('amount', this)" style="padding:5px 10px;" data-i18n="btnAmount">عدد</button>
                </div>
            </div>
            
            <div class="filters" id="chartFilters">
                <button class="btn-outline active" onclick="setFilter('all', this)" data-i18n="filterAll">کل</button>
                <button class="btn-outline" onclick="setFilter('month', this)" data-i18n="filterMonth">این ماه</button>
                <button class="btn-outline" onclick="setFilter('week', this)" data-i18n="filterWeek">این هفته</button>
                <button class="btn-outline" onclick="setFilter('day', this)" data-i18n="filterDay">امروز</button>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
                <div>
                    <h3 style="text-align:center; font-size:0.9rem; color:var(--text-muted);" data-i18n="chartExp">تفکیک هزینه‌ها</h3>
                    <div style="height:220px; position:relative;"><canvas id="mainChart"></canvas></div>
                </div>
                <div>
                    <h3 style="text-align:center; font-size:0.9rem; color:var(--text-muted);" data-i18n="chartIO">ورودی / خروجی</h3>
                    <div style="height:220px; position:relative;"><canvas id="ioChart"></canvas></div>
                </div>
            </div>
        </div>

        <!-- Transaction History -->
        <div class="card full-width">
            <h2 data-i18n="historyTitle">تاریخچه تراکنش‌ها</h2>
            <div class="summary-box">
                <div class="summary-item summary-income" id="sumIncome">جمع درآمد: 0</div>
                <div class="summary-item summary-expense" id="sumExpense">جمع خرج: 0</div>
            </div>
            <ul class="transaction-list" id="transactionList"></ul>
        </div>
    </div>
</div>

<!-- ADMIN PANEL PAGE -->
<div id="adminPage" class="container hidden" style="max-width: 800px; margin: auto;">
    <div class="card full-width">
        <div class="flex-between">
            <h2 style="color:var(--warning)" data-i18n="adminPanelTitle">پنل مدیریت کل</h2>
            <button class="btn-outline" onclick="closeAdminPanel()" data-i18n="backBtn">بازگشت</button>
        </div>
        <table>
            <thead><tr><th data-i18n="tbUser">کاربر</th><th data-i18n="tbStatus">وضعیت</th><th data-i18n="tbAction">عملیات</th></tr></thead>
            <tbody id="usersTableBody"></tbody>
        </table>
    </div>
</div>

<!-- SETTINGS PAGE -->
<div id="settingsPage" class="container hidden" style="max-width: 500px; margin: auto;">
    <div class="card full-width">
        <h2 data-i18n="settingsTitle">پروفایل و تنظیمات</h2>
        <form id="settingsForm">
            <label style="color:var(--text-muted); font-size:0.8rem;" data-i18n="setUname">نام کاربری (غیرقابل تغییر):</label>
            <input type="text" id="set_username" disabled>
            
            <label style="color:var(--text-muted); font-size:0.8rem;" data-i18n="setName">نام نمایشی:</label>
            <input type="text" id="set_displayName" data-i18n-placeholder="setNamePlh" placeholder="نام نمایشی">
            
            <label style="color:var(--text-muted); font-size:0.8rem;" data-i18n="setPass">تغییر رمز عبور:</label>
            <input type="password" id="set_password" data-i18n-placeholder="setPassPlh" placeholder="رمز عبور جدید">
            
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button type="submit" style="flex:1" data-i18n="saveBtn">ذخیره تغییرات</button>
                <button type="button" class="btn-outline" onclick="closeSettings()" data-i18n="cancelBtn">انصراف</button>
            </div>
            <hr style="border-color:var(--glass-border); margin: 20px 0;">
            <div style="display:flex; gap:10px;">
                <button type="button" class="btn-outline" style="flex:1" onclick="exportData()" data-i18n="exportBtn">دانلود اکسل</button>
                <button type="button" class="btn-danger" style="flex:1" onclick="clearMyData()" data-i18n="clearBtn">حذف اطلاعات</button>
            </div>
        </form>
    </div>
</div>

<script>
    /* =========================================
       0. DICTIONARY & LANGUAGE LOGIC
       ========================================= */
    const dict = {
        fa: {
            themeBtn: "🌓 تم", authTitle: "ورود / ثبت‌نام", loginBtn: "ورود", regBtn: "ثبت‌نام جدید", 
            adminBtn: "⚙️ مدیریت", currentBalance: "موجودی فعلی", aiAnalysis: "تحلیل‌گر مالی", 
            addTrans: "ثبت تراکنش", saveBtn: "ثبت", chartTitle: "آنالیز و آمار", btnPercent: "درصد", btnAmount: "عدد", 
            historyTitle: "تاریخچه تراکنش‌ها", settingsTitle: "پروفایل و تنظیمات", backBtn: "بازگشت",
            adminPanelTitle: "پنل مدیریت کل", tbUser: "کاربر", tbStatus: "وضعیت", tbAction: "عملیات",
            instTitle: "مدیریت اقساط", instUpcoming: "اقساط پیش رو:", instSaveBtn: "ثبت یادآوری",
            optExpense: "هزینه (خروجی)", optIncome: "درآمد (ورودی)", cancelBtn: "انصراف",
            setUname: "نام کاربری (غیرقابل تغییر):", setName: "نام نمایشی:", setPass: "تغییر رمز عبور:",
            exportBtn: "دانلود اکسل", clearBtn: "حذف اطلاعات",
            
            // New UI Elements
            netBalText: "پس از کسر اقساط این ماه:", sumInc: "جمع درآمد", sumExp: "جمع خرج",
            filterAll: "کل", filterMonth: "این ماه", filterWeek: "این هفته", filterDay: "امروز",
            chartExp: "تفکیک هزینه‌ها", chartIO: "ورودی / خروجی",
            
            // Placeholders
            usernamePlh: "نام کاربری", passwordPlh: "رمز عبور", amountPlh: "مبلغ",
            descPlh: "توضیحات (اختیاری)", setNamePlh: "نام نمایشی", setPassPlh: "رمز عبور جدید"
        },
        en: {
            themeBtn: "🌓 Theme", authTitle: "Login / Sign Up", loginBtn: "Login", regBtn: "Sign Up", 
            adminBtn: "⚙️ Admin", currentBalance: "Current Balance", aiAnalysis: "AI Analyst", 
            addTrans: "Add Transaction", saveBtn: "Save", chartTitle: "Analytics", btnPercent: "Percent", btnAmount: "Amount", 
            historyTitle: "Transaction History", settingsTitle: "Profile & Settings", backBtn: "Back",
            adminPanelTitle: "Master Admin Panel", tbUser: "User", tbStatus: "Status", tbAction: "Action",
            instTitle: "Installments", instUpcoming: "Upcoming:", instSaveBtn: "Set Reminder",
            optExpense: "Expense", optIncome: "Income", cancelBtn: "Cancel",
            setUname: "Username (Fixed):", setName: "Display Name:", setPass: "Change Password:",
            exportBtn: "Export CSV", clearBtn: "Clear Data",
            
            // New UI Elements
            netBalText: "After this month's installments:", sumInc: "Total Income", sumExp: "Total Expense",
            filterAll: "All Time", filterMonth: "This Month", filterWeek: "This Week", filterDay: "Today",
            chartExp: "Expenses Breakdown", chartIO: "Income vs Expense",
            
            // Placeholders
            usernamePlh: "Username", passwordPlh: "Password", amountPlh: "Amount",
            descPlh: "Notes (Optional)", setNamePlh: "Display Name", setPassPlh: "New Password"
        }
    };

    const categoriesList = {
        income: { fa: ['حقوق و کار', 'وام', 'قرض گرفتن', 'خانواده', 'فروش لوازم', 'سود بانکی', 'هدیه و پاداش', 'سرمایه گذاری (فروش)', 'سایر'], en: ['Salary/Work', 'Loan', 'Borrowing', 'Family', 'Selling Items', 'Bank Interest', 'Gift/Bonus', 'Investment (Sell)', 'Other'] },
        expense: { fa: ['غذا و خوراک', 'حمل و نقل', 'اینترنت و شارژ', 'آموزش', 'تفریح و سرگرمی', 'خرید شخصی', 'پوشاک و لباس', 'لوازم جانبی', 'سرمایه گذاری (خرید)', 'پرداخت قسط', 'پرداخت قرض', 'قرض دادن', 'بهداشت و دارو', 'مسکن و قبوض', 'سایر'], en: ['Food', 'Transport', 'Internet/Mobile', 'Education', 'Entertainment', 'Personal', 'Clothing', 'Accessories', 'Investment (Buy)', 'Pay Installment', 'Pay Debt', 'Lend Money', 'Health/Meds', 'Housing/Bills', 'Other'] }
    };

    const installmentCats = {
        fa: ['قسط اسنپ‌پی', 'قسط بانک ملی', 'قسط سایر بانک‌ها', 'قسط بیمه', 'قسط خوابگاه / دانشگاه', 'قسط موتور', 'قسط ماشین', 'قسط گوشی / لپ‌تاپ', 'قرض از دوست', 'قرض از خانواده', 'سایر بدهی‌ها'],
        en: ['SnappPay', 'Melli Bank', 'Other Banks', 'Insurance', 'Dorm/Uni', 'Motorcycle', 'Car', 'Phone/Laptop', 'Debt to Friend', 'Debt to Family', 'Other Debts']
    };

    let currentLang = 'fa';

    function toggleLang() {
        currentLang = currentLang === 'fa' ? 'en' : 'fa';
        document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
        
        document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = dict[currentLang][el.getAttribute('data-i18n')]);
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => el.placeholder = dict[currentLang][el.getAttribute('data-i18n-placeholder')]);

        updateCategories();
        updateInstallmentCategories();
        if(currentUser) updateUI();
    }

    function toggleTheme() {
        const root = document.documentElement;
        const isDark = root.getAttribute('data-theme') === 'dark';
        root.setAttribute('data-theme', isDark ? 'light' : 'dark');
        if(catChartObj && currentUser) updateUI();
    }

    function updateCategories() {
        const type = document.getElementById('type').value;
        const catSelect = document.getElementById('category');
        catSelect.innerHTML = '';
        categoriesList[type][currentLang].forEach((cat, index) => {
            let opt = document.createElement('option'); 
            opt.value = categoriesList[type]['fa'][index]; 
            opt.innerText = cat; 
            catSelect.appendChild(opt);
        });
    }

    function updateInstallmentCategories() {
        const catSelect = document.getElementById('instCategory');
        catSelect.innerHTML = '';
        installmentCats[currentLang].forEach((cat, index) => {
            let opt = document.createElement('option'); 
            opt.value = installmentCats['fa'][index]; 
            opt.innerText = cat;
            catSelect.appendChild(opt);
        });
    }

    /* =========================================
       1. CORE SYSTEM & AUTHENTICATION
       ========================================= */
    const MASTER_USER = "DavidZare";
    const MASTER_PASS = "DavidZare80";
    
    let usersDB = JSON.parse(localStorage.getItem('fm_users')) || [];
    if(usersDB.length === 0) {
        usersDB.push({ username: MASTER_USER, password: MASTER_PASS, status: 'approved', displayName: 'ادمین اصلی' });
        localStorage.setItem('fm_users', JSON.stringify(usersDB));
    }

    let currentUser = JSON.parse(sessionStorage.getItem('fm_current_user')) || null;
    let transactions = [];
    let installments = [];
    let catChartObj = null;
    let ioChartObj = null;
    let chartMode = 'percent'; 
    let currentFilter = 'all';

    document.getElementById('authForm').addEventListener('submit', (e) => { e.preventDefault(); loginUser(); });

    function registerUser() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        const msg = document.getElementById('authMsg');
        
        if(!u || !p) return;
        if(usersDB.find(x => x.username === u)) { msg.innerText = currentLang==='fa'?"این نام کاربری وجود دارد.":"Username exists."; return; }

        const stat = (u === MASTER_USER) ? 'approved' : 'pending';
        usersDB.push({ username: u, password: p, status: stat, displayName: u });
        localStorage.setItem('fm_users', JSON.stringify(usersDB));
        
        msg.style.color = "var(--income)";
        msg.innerText = stat === 'pending' ? (currentLang==='fa'?"ثبت‌نام شد! منتظر تایید مدیر.":"Registered! Wait for admin.") : (currentLang==='fa'?"ثبت‌نام موفق!":"Success!");
    }

    function loginUser() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        const msg = document.getElementById('authMsg');
        
        const user = usersDB.find(x => x.username === u && x.password === p);
        if(!user) { msg.innerText = currentLang==='fa'?"نام کاربری یا رمز عبور اشتباه است.":"Invalid credentials."; return; }
        if(user.status !== 'approved') { msg.innerText = currentLang==='fa'?"حساب شما تایید نشده است.":"Account not approved yet."; return; }

        currentUser = user;
        sessionStorage.setItem('fm_current_user', JSON.stringify(currentUser));
        loadApp();
    }

    function logout() {
        sessionStorage.removeItem('fm_current_user');
        currentUser = null;
        document.getElementById('userNav').classList.add('hidden');
        document.getElementById('appPage').classList.add('hidden');
        document.getElementById('adminPage').classList.add('hidden');
        document.getElementById('settingsPage').classList.add('hidden');
        document.getElementById('authPage').classList.remove('hidden');
        document.getElementById('authForm').reset();
        document.getElementById('authMsg').innerText = "";
    }

    /* =========================================
       2. APP LOGIC & DATA
       ========================================= */
    if(currentUser) { loadApp(); }

    function loadApp() {
        document.getElementById('authPage').classList.add('hidden');
        document.getElementById('appPage').classList.remove('hidden');
        document.getElementById('userNav').classList.remove('hidden');
        
        if(currentUser.username === MASTER_USER) { document.getElementById('adminBtn').classList.remove('hidden'); }
        
        document.getElementById('date').valueAsDate = new Date();
        const nextMonth = new Date(); nextMonth.setDate(nextMonth.getDate() + 30);
        document.getElementById('instDate').valueAsDate = nextMonth;

        transactions = JSON.parse(localStorage.getItem(`fm_data_${currentUser.username}`)) || [];
        installments = JSON.parse(localStorage.getItem(`fm_inst_${currentUser.username}`)) || [];
        
        updateCategories();
        updateInstallmentCategories();
        updateUI();
        setTimeout(checkPopups, 1000);
    }

    function toShamsi(gregorianStr) { return new Date(gregorianStr).toLocaleDateString('fa-IR'); }

    function checkPopups() {
        if(sessionStorage.getItem('popupShown')) return; 
        let alerts = [];
        const today = new Date(); today.setHours(0,0,0,0);
        
        installments.forEach(inst => {
            const instDate = new Date(inst.date); instDate.setHours(0,0,0,0);
            const diffDays = Math.ceil((instDate - today) / (1000 * 60 * 60 * 24));
            
            let name = currentLang === 'en' ? installmentCats['en'][installmentCats['fa'].indexOf(inst.title)] : inst.title;
            if (diffDays === 0) alerts.push(`<strong>${name}</strong> (${currentLang==='fa'?'امروز!':'Today!'})`);
            else if (diffDays === 1) alerts.push(`<strong>${name}</strong> (${currentLang==='fa'?'فردا':'Tomorrow'})`);
        });

        if(alerts.length > 0) {
            Swal.fire({
                title: currentLang==='fa'?'یادآوری اقساط 🔔':'Installment Alert 🔔',
                html: alerts.join('<br>'), icon: 'warning',
                confirmButtonText: currentLang==='fa'?'متوجه شدم':'Got it', confirmButtonColor: '#f59e0b',
                background: document.documentElement.getAttribute('data-theme')==='dark' ? '#1e293b' : '#f8fafc',
                color: document.documentElement.getAttribute('data-theme')==='dark' ? '#f8fafc' : '#0f172a'
            });
            sessionStorage.setItem('popupShown', 'true');
        }
    }

    function setFilter(timeframe, btn) {
        currentFilter = timeframe;
        const btns = document.getElementById('chartFilters').querySelectorAll('button');
        btns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateUI();
    }

    function updateUI() {
        // 1. Calculate All-Time Balances
        let totalBal = 0;
        transactions.forEach(t => totalBal += (t.type === 'income' ? t.amount : -t.amount));
        document.getElementById('totalBalance').innerText = totalBal.toLocaleString(currentLang==='fa'?'fa-IR':'en-US');

        // Net Balance (This month)
        let upcomingDebts = 0;
        const today = new Date(); today.setHours(0,0,0,0);
        const endOfMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0); 
        installments.forEach(inst => {
            const idate = new Date(inst.date);
            if(idate >= today && idate <= endOfMonth) upcomingDebts += inst.amount;
        });
        
        const netBalEl = document.getElementById('netBalance');
        if(upcomingDebts > 0) {
            netBalEl.style.display = 'inline-block';
            let nb = totalBal - upcomingDebts;
            netBalEl.innerText = dict[currentLang]['netBalText'] + " " + nb.toLocaleString(currentLang==='fa'?'fa-IR':'en-US');
            netBalEl.style.color = nb < 0 ? '#ef4444' : '#a7f3d0';
        } else {
            netBalEl.style.display = 'none';
        }

        // 2. Filter Data based on currentFilter
        let filteredTxs = transactions;
        if(currentFilter === 'day') {
             filteredTxs = transactions.filter(t => new Date(t.date).toDateString() === today.toDateString());
        } else if (currentFilter === 'week') {
             const fw = new Date(); fw.setDate(fw.getDate() - 7);
             filteredTxs = transactions.filter(t => new Date(t.date) >= fw);
        } else if (currentFilter === 'month') {
             filteredTxs = transactions.filter(t => {
                 let d = new Date(t.date); return d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
             });
        }

        // 3. Render List & Sums
        let sumInc = 0, sumExp = 0;
        const listEl = document.getElementById('transactionList');
        listEl.innerHTML = '';
        const expCats = {};

        filteredTxs.slice().reverse().forEach(t => {
            if(t.type === 'income') sumInc += t.amount; else sumExp += t.amount;
            
            if(t.type === 'expense') {
                let displayCat = currentLang === 'en' ? (categoriesList['expense']['en'][categoriesList['expense']['fa'].indexOf(t.category)] || t.category) : t.category;
                expCats[displayCat] = (expCats[displayCat] || 0) + t.amount;
            }

            let liCat = currentLang === 'en' ? (categoriesList[t.type]['en'][categoriesList[t.type]['fa'].indexOf(t.category)] || t.category) : t.category;
            
            const li = document.createElement('li');
            li.className = `transaction-item ${t.type}`;
            li.innerHTML = `
                <div style="flex:1;">
                    <div class="flex-between"><strong>${liCat}</strong><span class="transaction-date">${toShamsi(t.date)}</span></div>
                    ${t.desc ? `<div class="transaction-desc">${t.desc}</div>` : ''}
                </div>
                <div style="font-weight:bold; margin-inline-start: 15px; color: ${t.type==='income' ? 'var(--income)' : 'var(--expense)'}">
                    ${t.amount.toLocaleString(currentLang==='fa'?'fa-IR':'en-US')}
                </div>
            `;
            listEl.appendChild(li);
        });

        document.getElementById('sumIncome').innerText = dict[currentLang]['sumInc'] + ": " + sumInc.toLocaleString(currentLang==='fa'?'fa-IR':'en-US');
        document.getElementById('sumExpense').innerText = dict[currentLang]['sumExp'] + ": " + sumExp.toLocaleString(currentLang==='fa'?'fa-IR':'en-US');

        // 4. Render Charts
        renderCharts(expCats, sumInc, sumExp);

        // 5. Installments Render (Always show all upcoming)
        const instList = document.getElementById('installmentList');
        instList.innerHTML = '';
        installments.sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(inst => {
            const diffDays = Math.ceil((new Date(inst.date) - today) / (1000 * 60 * 60 * 24));
            let dayText = diffDays > 0 ? (currentLang==='fa'?`${diffDays} روز دیگر`:`in ${diffDays} days`) : (diffDays===0 ? (currentLang==='fa'?'امروز!':'Today!') : (currentLang==='fa'?'گذشته':'Passed'));
            let name = currentLang === 'en' ? installmentCats['en'][installmentCats['fa'].indexOf(inst.title)] || inst.title : inst.title;
            
            const li = document.createElement('li');
            li.className = `transaction-item installment`;
            li.innerHTML = `
                <div style="flex:1;">
                    <div class="flex-between"><strong>${name}</strong><span class="transaction-date" style="background:var(--warning); color:black;">${dayText} (${toShamsi(inst.date)})</span></div>
                    ${inst.desc ? `<div class="transaction-desc">${inst.desc}</div>` : ''}
                </div>
                <div style="font-weight:bold; margin-inline-start: 15px; color: var(--warning)">
                    ${inst.amount.toLocaleString(currentLang==='fa'?'fa-IR':'en-US')}
                </div>
            `;
            instList.appendChild(li);
        });

        // 6. AI Analysis (Always Last 7 Days)
        let exp7 = 0;
        const sevenDaysAgo = new Date(); sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
        transactions.forEach(t => { if(t.type === 'expense' && new Date(t.date) >= sevenDaysAgo) exp7 += t.amount; });
        
        const aiBox = document.getElementById('aiAnalysisBox');
        if(exp7 > 0) {
            let avg = Math.round(exp7 / 7);
            aiBox.innerHTML = currentLang === 'fa' 
                ? `هزینه ۷ روز گذشته: <b style="color:var(--warning)">${exp7.toLocaleString('fa-IR')}</b><br>میانگین روزانه: <b>${avg.toLocaleString('fa-IR')}</b>`
                : `Last 7 Days Exp: <b style="color:var(--warning)">${exp7.toLocaleString('en-US')}</b><br>Daily Avg: <b>${avg.toLocaleString('en-US')}</b>`;
        } else {
            aiBox.innerHTML = currentLang === 'fa' ? "داده کافی برای تحلیل وجود ندارد." : "Not enough data for analysis.";
        }
    }

    function setChartMode(mode, btn) {
        chartMode = mode;
        const btns = btn.parentElement.querySelectorAll('button');
        btns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateUI(); 
    }

    function renderCharts(expDataObj, totalInc, totalExp) {
        Chart.defaults.color = document.documentElement.getAttribute('data-theme') === 'light' ? '#475569' : '#94a3b8';
        Chart.defaults.font.family = 'Tahoma';
        const locale = currentLang === 'fa' ? 'fa-IR' : 'en-US';
        const colors = ['#ef4444','#f97316','#06b6d4','#0ea5e9','#d946ef','#8b5cf6'];

        // 1. Categories Chart
        const labels = Object.keys(expDataObj);
        const data = Object.values(expDataObj);
        
        if(catChartObj) catChartObj.destroy();
        catChartObj = new Chart(document.getElementById('mainChart'), {
            type: 'doughnut',
            data: { labels: labels.length?labels:['Empty'], datasets: [{ data: data.length?data:[1], backgroundColor: data.length?colors:['#334155'], borderWidth:0}] },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    legend: { position: currentLang==='fa'?'right':'left', display: data.length > 0 },
                    tooltip: { callbacks: { label: function(ctx) {
                        if(!data.length) return '';
                        let total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                        let pct = ((ctx.raw / total) * 100).toFixed(1) + '%';
                        return chartMode === 'amount' ? ` ${ctx.raw.toLocaleString(locale)}` : ` ${pct}`;
                    }}}
                }
            }
        });

        // 2. Income vs Expense Chart
        if(ioChartObj) ioChartObj.destroy();
        ioChartObj = new Chart(document.getElementById('ioChart'), {
            type: 'pie',
            data: { 
                labels: [dict[currentLang]['optIncome'], dict[currentLang]['optExpense']], 
                datasets: [{ data: [totalInc, totalExp], backgroundColor: ['#10b981', '#ef4444'], borderWidth:0}] 
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom' },
                    tooltip: { callbacks: { label: function(ctx) { return ` ${ctx.raw.toLocaleString(locale)}`; }}}
                }
            }
        });
    }

    // Forms
    document.getElementById('transactionForm').addEventListener('submit', (e) => {
        e.preventDefault();
        transactions.push({
            id: Date.now(), type: document.getElementById('type').value,
            amount: parseFloat(document.getElementById('amount').value),
            category: document.getElementById('category').value,
            date: document.getElementById('date').value, desc: document.getElementById('description').value
        });
        localStorage.setItem(`fm_data_${currentUser.username}`, JSON.stringify(transactions));
        e.target.reset(); document.getElementById('date').valueAsDate = new Date();
        updateCategories(); updateUI();
    });

    document.getElementById('installmentForm').addEventListener('submit', (e) => {
        e.preventDefault();
        installments.push({
            id: Date.now(), title: document.getElementById('instCategory').value,
            amount: parseFloat(document.getElementById('instAmount').value),
            date: document.getElementById('instDate').value, desc: document.getElementById('instDesc').value
        });
        localStorage.setItem(`fm_inst_${currentUser.username}`, JSON.stringify(installments));
        e.target.reset(); 
        const nextMonth = new Date(); nextMonth.setDate(nextMonth.getDate() + 30);
        document.getElementById('instDate').valueAsDate = nextMonth;
        updateUI();
    });

    /* =========================================
       3. ADMIN & SETTINGS
       ========================================= */
    function showAdminPanel() { document.getElementById('appPage').classList.add('hidden'); document.getElementById('adminPage').classList.remove('hidden'); renderAdminTable(); }
    function closeAdminPanel() { document.getElementById('adminPage').classList.add('hidden'); document.getElementById('appPage').classList.remove('hidden'); }

    function renderAdminTable() {
        const tbody = document.getElementById('usersTableBody');
        tbody.innerHTML = '';
        usersDB.forEach((u, index) => {
            const tr = document.createElement('tr');
            let actionBtn = u.status === 'pending' 
                ? `<button onclick="approveUser(${index})" style="background:var(--income); padding:5px; font-size:0.8rem;">تایید/Approve</button>`
                : `<span style="color:var(--income)">✅</span>`;
            let delBtn = u.username !== MASTER_USER ? `<button onclick="deleteUser(${index})" class="btn-danger" style="padding:5px; font-size:0.8rem;">حذف/Delete</button>` : '-';
            tr.innerHTML = `<td>${u.username}</td><td>${u.status}</td><td>${actionBtn} ${delBtn}</td>`;
            tbody.appendChild(tr);
        });
    }
    function approveUser(idx) { usersDB[idx].status = 'approved'; localStorage.setItem('fm_users', JSON.stringify(usersDB)); renderAdminTable(); }
    function deleteUser(idx) {
        if(confirm(currentLang==='fa'?"مطمئن هستید؟":"Are you sure?")) {
            localStorage.removeItem(`fm_data_${usersDB[idx].username}`); localStorage.removeItem(`fm_inst_${usersDB[idx].username}`); 
            usersDB.splice(idx, 1); localStorage.setItem('fm_users', JSON.stringify(usersDB)); renderAdminTable();
        }
    }

    function showSettings() {
        document.getElementById('appPage').classList.add('hidden'); document.getElementById('settingsPage').classList.remove('hidden');
        document.getElementById('set_username').value = currentUser.username; document.getElementById('set_displayName').value = currentUser.displayName || '';
    }
    function closeSettings() { document.getElementById('settingsPage').classList.add('hidden'); document.getElementById('appPage').classList.remove('hidden'); }

    document.getElementById('settingsForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const dName = document.getElementById('set_displayName').value.trim();
        const np = document.getElementById('set_password').value.trim();
        let userIdx = usersDB.findIndex(x => x.username === currentUser.username);
        
        usersDB[userIdx].displayName = dName || usersDB[userIdx].username;
        if(np) usersDB[userIdx].password = np;
        
        localStorage.setItem('fm_users', JSON.stringify(usersDB));
        currentUser = usersDB[userIdx]; sessionStorage.setItem('fm_current_user', JSON.stringify(currentUser));
        
        closeSettings(); loadApp();
    });

    function exportData() {
        let csv = "Type,Amount,Category,Date,Description\n";
        transactions.forEach(t => { csv += `${t.type},${t.amount},${t.category},${t.date},${t.desc||''}\n`; });
        const link = document.createElement("a"); link.href = encodeURI("data:text/csv;charset=utf-8,\uFEFF" + csv);
        link.download = `finance_${currentUser.username}.csv`; link.click();
    }
    function clearMyData() {
        if(confirm(currentLang==='fa'?"تمام داده‌های تراکنش حذف خواهد شد! مطمئن هستید؟":"All transaction data will be deleted! Are you sure?")) {
            localStorage.removeItem(`fm_data_${currentUser.username}`); localStorage.removeItem(`fm_inst_${currentUser.username}`);
            transactions = []; installments = []; updateUI();
        }
    }
</script>
